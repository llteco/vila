[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "vila"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Wenyi Tang", email = "wenyitang@outlook.com" }]
license = { file = "LICENSE" }
classifiers = ["License :: OSI Approved :: MIT License"]
dynamic = ["version", "description"]
dependencies = ["numpy"]

[project.urls]
Home = "https://github.com/llteco/vila"
Docs = "https://llteco.github.io/vila"

[project.optional-dependencies]
test = ["pre-commit", "pytest", "pytest-cov", "pooch"]

[dependency-groups]
dev = [
    "pooch>=1.9.0",
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
]
