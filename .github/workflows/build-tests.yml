name: build vila package
run-name: ${{ github.actor }} build and test
on:
  pull_request:
    paths:
      - 'clim/**'
      - 'vila/**'
      - 'tests/**'
      - '*.bazel'
jobs:
  test-vila:
    runs-on: [self-hosted, Linux]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: lfs fetch
        run: git submodule foreach --recursive git lfs pull
      - name: Setup Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - name: download bazel
        run: |
          if ! which bazelisk; then wget https://github.com/bazelbuild/bazelisk/releases/download/v1.21.0/bazelisk-linux-amd64 && chmod +x bazelisk-linux-amd64 && export PATH=$PATH:`pwd`; fi
          if [ -e bazelisk-linux-amd64 ]; then mv ./bazelisk-linux-amd64 bazelisk; fi
      - name: build and test package
        run: bazelisk test //tests/...
      - name: build using legacy WORKSPACE
        run: |
          bazelisk --output_base=/tmp/_vila_workspace build --noenable_bzlmod //tests/...
      - name: Install vila python package
        run: python -m pip install -e python[test]
      - name: Test vila python package
        run: python -m pytest --cov=python/vila python/tests
