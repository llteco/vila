name: build vila package
run-name: ${{ github.actor }} build and test
on:
  pull_request:
    paths:
      - 'clim/**'
      - 'vila/**'
      - 'tests/**'
      - '*.bazel'
  workflow_dispatch:

jobs:
  test-vila:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: lfs fetch
        run: git submodule foreach --recursive git lfs pull
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true
      - name: build and test package
        run: bazelisk test //tests/...
      - name: build using legacy WORKSPACE
        run: |
          bazelisk --output_base=/tmp/_vila_workspace build --noenable_bzlmod //tests/...
      - name: Install vila python package
        run: python -m pip install -e python[test]
      - name: Test vila python package
        run: python -m pytest --cov=python/vila python/tests
