name: build vila package
run-name: ${{ github.actor }} build and test
on:
  pull_request:
    paths:
      - 'clim/**'
      - 'vila/**'
      - 'tests/**'
      - '*.bazel'
jobs:
  test-vila:
    runs-on: [self-hosted, Linux]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: lfs fetch
        run: git submodule foreach --recursive git lfs pull
      - name: Setup Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - name: download bazel
        run: |
          wget https://github.com/bazelbuild/bazel/releases/download/7.3.1/bazel-7.3.1-linux-x86_64
          chmod +x bazel-7.3.1-linux-x86_64
      - name: build and test package
        run: ./bazel-7.3.1-linux-x86_64 test -k //tests/...
      - name: Clean up bazel
        run: rm bazel-7.3.1-linux-x86_64
      - name: Install vila python package
        run: python -m pip install -e python[test]
      - name: Test vila python package
        run: python -m pytest --cov=python/vila python/tests
