name: build vila package by cmake
run-name: ${{ github.actor }} build using CMake tool
on:
  pull_request:
    paths:
      - 'clim/**'
      - 'vila/**'
      - '**/CMakeLists.txt'
  workflow_dispatch:

jobs:
  build-vila-cmake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: lfs fetch
        run: git submodule foreach --recursive git lfs pull
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: download cmake
        run: |
          python -m pip install -U cmake ninja
          cmake --version
          ninja --version
      - name: build package
        run: |
          mkdir build
          cmake -Bbuild -S. -GNinja
          cmake --build build --config Release
