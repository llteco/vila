[tool.uv.workspace]
members = ["python"]

[tool.pyright]
include = ["python"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
addopts = ["-q", "-s"]

[tool.flake8]
ignore = ['E231', 'E241', 'E704']
per-file-ignores = ['__init__.py:F401']
exclude = []
max-line-length = 88
max-complexity = 20
count = true

[tool.isort]
profile = "black"
skip_glob = []

[tool.pylint."MAIN"]
ignore-paths = []

[tool.pylint."MESSAGES CONTROL"]
disable = [
    "logging-fstring-interpolation",
    "missing-module-docstring",
    "no-member",
    "no-name-in-module",
    "fixme",
    "R",
    "I",
]
