[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vila"
description = "Commonly used Python libraries"
readme = "python/README.md"
requires-python = ">=3.10"
authors = [{ name = "Wenyi Tang", email = "wenyitang@outlook.com" }]
license = { file = "python/LICENSE" }
classifiers = ["License :: OSI Approved :: MIT License"]
dynamic = ["version"]
dependencies = ["numpy"]

[project.urls]
Home = "https://github.com/llteco/vila"
Docs = "https://llteco.github.io/vila"

[project.optional-dependencies]
test = ["pre-commit", "pytest", "pytest-cov", "pooch"]

[tool.setuptools.packages.find]
where = ["python"]
include = ["vila*"]

[tool.setuptools.dynamic]
version = { attr = "vila.__version__" }

[dependency-groups]
dev = [
    "apache-tvm-ffi>=0.1.12",
    "pooch>=1.9.0",
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
]

[tool.pyright]
include = ["python"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
addopts = ["-q", "-s"]

[tool.flake8]
ignore = ['E231', 'E241', 'E704']
per-file-ignores = ['__init__.py:F401']
exclude = []
max-line-length = 88
max-complexity = 20
count = true

[tool.isort]
profile = "black"
skip_glob = []

[tool.pylint."MAIN"]
ignore-paths = []

[tool.pylint."MESSAGES CONTROL"]
disable = [
    "logging-fstring-interpolation",
    "missing-module-docstring",
    "no-member",
    "no-name-in-module",
    "fixme",
    "R",
    "I",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "UP", "I"]
ignore = ["E203", "E231", "E241"]
